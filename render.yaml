services:
  - type: web
    name: perfilar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: DATABASE_URL
        fromDatabase:
          name: perfilar-db
          property: connectionString
databases:
  - name: perfilar-db
    plan: free
